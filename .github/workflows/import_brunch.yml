name: Import verified Brunch originals

on:
  workflow_dispatch:
  push:
    paths:
      - 'writing_source/brunch_import.yml'
      - 'writing_source/scripts/sync_brunch_originals.py'
      - '.github/workflows/import_brunch.yml'

permissions:
  contents: write

concurrency:
  group: import-brunch
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install requests beautifulsoup4 PyYAML
      - name: Import only verified available author originals
        run: python writing_source/scripts/sync_brunch_originals.py
      - name: Validate imported text and metadata
        shell: bash
        run: |
          python - <<'PY'
          import datetime, pathlib, re, yaml
          root=pathlib.Path('writing_source/content/collections')
          for p in root.rglob('*.md'):
              if not any(part in p.parts for part in ('arctic','tallinn','venezuela','short-disappearance')):
                  continue
              data=p.read_text(encoding='utf-8-sig')
              m=re.match(r'\A---\s*\n(.*?)\n---\s*\n?(.*)', data, flags=re.S)
              if not m: raise SystemExit(f'Missing frontmatter: {p}')
              meta=yaml.safe_load(m.group(1))
              if meta.get('status')=='text' and not m.group(2).strip():
                  raise SystemExit(f'Empty body marked as text: {p}')
              if meta.get('date'):
                  datetime.date.fromisoformat(str(meta['date']))
              if '\\' in m.group(2):
                  print(f'Check literal backslash in {p}')
          PY
      - name: Commit imported Markdown
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- writing_source/content/collections)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add writing_source/content/collections
            git commit -m 'Import original Brunch writing as clean Markdown'
            git push
          else
            echo 'No new verifiable original texts to import.'
          fi
