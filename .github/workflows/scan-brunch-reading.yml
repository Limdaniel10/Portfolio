name: One-time Brunch Reading magazine inventory
on:
  push:
    paths:
      - scripts/scan_brunch_reading.py
      - .github/workflows/scan-brunch-reading.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install request and parsing tools
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.4
      - name: Scan bounded 2025 reading-magazine posts
        run: python scripts/scan_brunch_reading.py
      - name: Commit public post index only when sufficiently complete
        shell: bash
        run: |
          git add reading/data/brunch-index.json
          if git diff --cached --quiet; then
            echo "Brunch index unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(reading): inventory public Brunch magazine posts"
          git push origin HEAD:main
