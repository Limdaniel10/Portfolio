name: Import authored Brunch manuscripts to Writing
on:
  push:
    paths:
      - scripts/import_brunch_originals.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Brunch HTML parser
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.4
      - name: Import all 13 originals, fail before changes if any is missing
        run: python scripts/import_brunch_originals.py
      - name: Commit verified manuscripts to GitHub
        shell: bash
        run: |
          if git diff --quiet -- writing_source/content/collections/el-salvador; then
            echo "No new manuscript files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing_source/content/collections/el-salvador
          git commit -m "Import all 13 El Salvador original Brunch articles as Markdown"
          git push origin HEAD:main
